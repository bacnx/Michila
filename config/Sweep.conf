#Enables the sleep management features
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Battery reporting (seconds). Both halves' levels are forwarded to the host.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Mouse support
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# USB boot protocol (keyboard works in BIOS/UEFI over USB)
CONFIG_ZMK_USB_BOOT=y

# Bluetooth setup
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Max BLE TX power (+8 dBm, Zephyr default is 0): stronger link between the halves and to the host
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Send battery notifications even if the host never subscribed (Windows battery display)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Turn on logging, and set ZMK logging to debug output
# WARNING: BATTERY INTENSIVE, TURN OFF WHEN NOT DEBUGGING
# CONFIG_ZMK_USB_LOGGING=y
